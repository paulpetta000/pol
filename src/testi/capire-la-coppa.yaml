# Testi di /capire-la-coppa/. Come si scrivono: vedi src/lib/testi.ts e il README.

flotta:
  usa: [cal-flotta]
  testo: |
    **E le regate di flotta?** Qui sopra vedi un duello, come nel Match. Nelle regate di flotta invece partono tutte le barche insieme: è così che comincia la Louis Vuitton Cup 2027. Le date sono qui sotto, nel formato.

cifre:
  usa: [cal-match, cal-finale-lvc, cal-semifinali, cal-vento, reg-penalita]
  voci:
    - num: "7"
      testo: vittorie per chiudere il Match, e anche la finale della Louis Vuitton Cup
    - num: "5"
      testo: vittorie per superare una semifinale
    - num: "6,5–23"
      testo: "nodi di vento: con meno o con più vento non si parte"
    - num: "75 m"
      testo: di distanza dietro l'avversario per scontare una penalità, con le regole del 2024{?reg-penalita}

formato:
  usa: [cal-lvc-periodo, sq-sette, cal-match, cal-flotta, cal-rr, cal-pausa, cal-defender-gironi, cal-ripescaggio, cal-semifinali, cal-finale-lvc, cal-match-preparazione, cal-match-riserva, cal-vento]
  testo: |
    ### Il formato 2027

    La Coppa si gioca in due tempi. Prima la Louis Vuitton Cup, dal 22 maggio al 4 luglio al più tardi: sei squadre si contendono il diritto di sfidare chi la Coppa la difende. Poi, dal 10 luglio, il Match tra il vincitore della Louis Vuitton Cup ed Emirates Team New Zealand, il detentore.

    Si comincia sabato 22 e domenica 23 maggio con le regate di flotta, tre al giorno: tutti e sette gli AC75 sulla stessa linea di partenza. Non era mai successo nella storia della Coppa.

    Dal 26 maggio si passa ai duelli, una barca contro l'altra. Sono tre giri in cui tutti affrontano tutti, i Round Robin, da 21 regate ciascuno: dal 26 al 28 maggio, dal 29 al 31 maggio e dal 9 all'11 giugno. Tra il secondo e il terzo c'è una settimana di pausa, dal 1° all'8 giugno.

    Emirates Team New Zealand corre anche i Round Robin, ma i suoi risultati non contano per la classifica degli sfidanti. Alla fine i primi tre sfidanti vanno dritti in semifinale; gli altri tre si giocano il quarto posto nel ripescaggio del 12 e 13 giugno.

    Le semifinali vanno dal 16 al 20 giugno, con il 21 di riserva: passa chi vince per primo 5 regate. Lo sfidante primo in classifica sceglie il suo avversario.

    La finale della Louis Vuitton Cup comincia nel fine settimana del 26 e 27 giugno e, se serve, si chiude il 3 e 4 luglio. Vince chi arriva per primo a 7 vittorie, su un massimo di 13 regate.

    Dopo almeno cinque giorni di pausa parte il Match, con la stessa regola: servono 7 vittorie per portarsi a casa la Coppa. L'ultimo giorno in programma è il 19 luglio; se il meteo fa saltare delle regate, il direttore di regata può aggiungere giorni.

    E il vento? Gli AC75 partono solo se soffia tra 6,5 e 23 nodi. Se il vento è troppo debole o troppo forte la regata aspetta, e se non cambia nulla salta.

regole:
  usa: [reg-2027-attese, reg-percorso, reg-partenza, reg-ocs, reg-precedenze, reg-penalita, reg-confini, reg-durata, reg-arrivo]
  testo: |
    ### Le regole in regata

    Le regole di regata del 2027 non sono ancora uscite{?reg-2027-attese}. Qui ti raccontiamo quelle del 2024, l'ultima edizione: qualche dettaglio potrebbe cambiare.

    Si parte contro il vento e si va avanti e indietro tra due «cancelli», cioè due coppie di boe, una in alto e una in basso. Nel 2024, a quanto si legge, i percorsi avevano 4, 6 o 8 lati{?reg-percorso}.

    La partenza è il momento più teso. Poco più di due minuti prima del via le due barche entrano nell'area di partenza da lati opposti e si studiano. Al segnale devono essere dietro la linea: chi la passa in anticipo è «OCS» e viene penalizzato, e se è avanti di più di 3 secondi deve tornare indietro e ripassarla{?reg-partenza,reg-ocs}.

    Quando due barche si incrociano, quella con le mure a sinistra, cioè con il vento che arriva da sinistra, lascia strada all'altra. Se hanno le mure dallo stesso lato, chi è sopravento lascia strada a chi è sottovento{?reg-precedenze}.

    Con le regole del 2024, chi infrange una regola viene penalizzato dagli arbitri: deve rallentare finché non si trova 75 metri dietro l'avversario, e ha 60 secondi per farlo, altrimenti si prende un'altra penalità. Vale anche per chi esce dal campo: i confini sono virtuali, li vedi solo sugli strumenti di bordo e nella grafica della TV{?reg-penalita,reg-confini}.

    Le regate sono brevi. Nel 2024, scrivevano le riviste di vela, il primo lato andava chiuso entro 12 minuti e la regata intera entro 45{?reg-durata}. Vince chi taglia per primo il traguardo con tutte le penalità scontate.
