# Testi della pagina /napoli/dove-mangiare/. Come si scrivono: src/lib/testi.ts e README.
# I testi brevi dei locali stanno in locali.yaml; le due righe sui piatti tipici qui sotto, «piatto-<id>».

intro:
  senzaFonte: "Spiega che cosa c'è nella pagina; ogni dato dei locali ha la sua scheda con la fonte"
  testo: |
    In tutte le zone della città trovi pizzerie, trattorie, ristoranti di mare, friggitorie, pasticcerie e caffè. Con i filtri scegli che cosa vuoi mangiare, quanto vuoi spendere, quando e dove. Poi aggiungi il locale al tuo itinerario come una tappa: per il pranzo, la cena o uno spuntino.

criteri:
  senzaFonte: "Spiega come scegliamo i locali: sono regole nostre"
  testo: |
    Entrano solo i locali che scrivono i loro orari, sul sito o nella scheda Google del locale: senza orari non possiamo dirti se è aperto quando ci passi. Tra questi scegliamo con le stesse regole per tutti. Cerchiamo:

    - una **storia documentata**, scritta dal locale o da un giornale;
    - un **riconoscimento** di una guida o di un giornale indipendente (Guida Michelin, Gambero Rosso, Slow Food, 50 Top Pizza);
    - un **posto comodo** tra le tappe degli itinerari, in tutte le zone.

    Se la scelta è nostra, perché il locale non ha un riconoscimento, la scheda lo dice. Non diamo voti e non scriviamo «il migliore». Alcuni locali famosi mancano solo perché non scrivono gli orari: se li pubblicano, li aggiungiamo.

fasce:
  senzaFonte: "Spiega la regola delle fasce di prezzo, decisa da noi; i prezzi di ogni locale hanno la loro scheda"
  testo: |
    La fascia di prezzo viene dal menu del locale, con la data in cui l'abbiamo letto. Contiamo un **pasto base** a persona, senza bevande né coperto:

    - nei ristoranti e nelle trattorie, il primo e il secondo meno cari del menu;
    - nelle pizzerie, una margherita;
    - nel cibo di strada, una pizza fritta o un cuoppo;
    - nelle pasticcerie e nei caffè, una sfogliatella e un caffè.

    **€** fino a 15 euro, **€€** da 15 a 35 euro, **€€€** oltre 35 euro. Se il locale non pubblica i prezzi, non ha una fascia e la scheda lo dice: non la inventiamo.

indipendente:
  senzaFonte: "Dice come è fatta la lista: è una nostra scelta"
  testo: |
    Nessun locale paga per stare nella lista, e nei link non ci sono affiliazioni. Il menu lo apri sul sito del locale, fuori da questa guida.

orari:
  senzaFonte: "Spiega da dove vengono gli orari: ogni orario ha la sua scheda con la fonte"
  testo: |
    Orari e prezzi sono quelli scritti dai locali il 4 ottobre 2026, quando li abbiamo letti. Per l'estate 2027 nessun locale li ha ancora pubblicati. Li ricontrolliamo entro aprile 2027 e poi prima della Coppa. Le chiusure per ferie e i giorni di festa li scriviamo solo se il locale li dice: prima di andare, soprattutto ad agosto, ti conviene controllare sul suo sito.

itinerario:
  senzaFonte: "Spiega come funziona il collegamento con il compositore degli itinerari"
  testo: |
    «Aggiungi all'itinerario» mette il locale nel tuo itinerario, sul telefono, con i minuti per arrivarci dalla tappa prima. Se a quell'ora il locale è chiuso, o chiude prima della fine del pasto, l'itinerario te lo dice. Per trovare i locali vicini alle tue tappe e aperti quando ci passi, la pagina usa l'itinerario salvato su questo telefono: non lo manda a nessuno.

# ---------- Piatti tipici: due righe per il filtro «Cosa vuoi mangiare» (Wikipedia) ----------
piatto-margherita:
  fonti: [wiki-margherita]
  testo: |
    È la pizza napoletana più famosa: pomodoro, fior di latte (una mozzarella di latte di mucca), basilico fresco, sale e olio.

piatto-marinara:
  fonti: [wiki-marinara]
  testo: |
    Una tipica pizza napoletana senza formaggio, con pomodoro, aglio, origano e olio.

piatto-pizza-fritta:
  fonti: [wiki-pizza-fritta]
  testo: |
    A Napoli è il calzone fritto, ripieno per esempio di ricotta, provola, cicoli (pezzetti di grasso di maiale) o salame. La chiamano anche «pizza del popolo».

piatto-frittatina:
  fonti: [wiki-frittatina]
  testo: |
    Una piccola frittata di pasta: pasta con la besciamella, passata nella pastella e fritta. È un tipico cibo di strada napoletano.

piatto-genovese:
  fonti: [wiki-genovese]
  testo: |
    Un sugo bianco di cipolle e carne di manzo, tipico della cucina napoletana, cotto per ore. Niente pomodoro e niente carote.

piatto-ragu:
  fonti: [wiki-ragu]
  testo: |
    Il sugo più conosciuto della cucina napoletana: carne di manzo cotta lentamente nel pomodoro. Era il piatto della domenica.

piatto-pasta-patate:
  fonti: [wiki-pasta-patate]
  testo: |
    Pasta cotta insieme alle patate, con la provola (un formaggio filante) e a volte con la salsiccia.

piatto-vongole:
  fonti: [wiki-vongole]
  testo: |
    Spaghetti al dente saltati in padella con le vongole, piccoli molluschi di mare, sfumate con il vino bianco.

piatto-frittura:
  fonti: [wiki-frittura]
  testo: |
    La frittura di paranza è fatta con pesci piccoli, come triglie, naselli e alici. Prende il nome dalla paranza, una barca da pesca.

piatto-parmigiana:
  fonti: [wiki-parmigiana]
  testo: |
    Melanzane fritte e passate in forno con pomodoro, basilico e formaggio, a strati.

piatto-baccala:
  fonti: [wiki-baccala]
  testo: |
    Il merluzzo conservato sotto sale. In Campania è un piatto tipico della vigilia di Natale.

piatto-sfogliatella:
  fonti: [wiki-sfogliatella]
  testo: |
    Il dolce tipico della pasticceria campana, in due versioni: riccia, con la pasta sfoglia a strati sottili, oppure frolla, con la pasta frolla.

piatto-baba:
  fonti: [wiki-baba]
  testo: |
    Un dolce di pasta lievitata a forma di fungo, bagnato nel rum. È nato in Francia ed è diventato tipico di Napoli.

piatto-pastiera:
  fonti: [wiki-pastiera]
  testo: |
    Il dolce napoletano di Pasqua: pasta frolla ripiena di grano cotto nel latte, ricotta, zucchero e uova, profumata di arancia e cannella.
