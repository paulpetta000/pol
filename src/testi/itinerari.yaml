# Testi della pagina /napoli/itinerari/ (il compositore degli itinerari). Come si scrivono: src/lib/testi.ts e README.
# I testi brevi delle tappe stanno in tappe.yaml; qui le parti comuni, le regate e gli itinerari pronti.

regate:
  usa: [cal-orari, cal-orari-2026]
  testo: |
    Gli orari delle regate 2027 non sono ancora usciti. Nel 2026 a Napoli si partiva ogni giorno alle 14:00, e per ora mettiamo le regate a quell'ora{?cal-orari,cal-orari-2026}. Per scegliere dove metterti a guardarle, vai alla pagina [dal lungomare](/come-vederla/dal-lungomare/).

pronto-mezza-giornata:
  usa: [tp-sansevero-orari, tp-sansevero-prenota]
  testo: |
    Una mattina nel centro storico, tutta a piedi: il Cristo velato, il chiostro di maioliche, Spaccanapoli e, per finire, la pizza a portafoglio. Non andarci di martedì, perché la Cappella Sansevero è chiusa. E compra il biglietto online prima: senza, non entri.

pronto-un-giorno:
  usa: [tp-sanmartino-orari, tp-sansevero-orari]
  testo: |
    Parti dall'alto, al Vomero, con la vista dal Castel Sant'Elmo. Poi scendi a piedi per la Pedamentina fino al centro storico, passi da Spaccanapoli e chiudi con la pizza in via dei Tribunali. Il martedì no: sono chiuse la Certosa di San Martino e la Cappella Sansevero.

pronto-due-giorni:
  usa: [tp-mann-orari, tp-sansevero-orari, tp-sanmartino-orari, tp-palazzoreale-orari]
  testo: |
    Il primo giorno ti porta al Museo Archeologico e nel centro storico, il secondo al Vomero, in via Toledo, a piazza del Plebiscito e sul mare. Il primo giorno evita il martedì, quando chiudono il museo e la Cappella Sansevero. Il secondo evita sia il martedì sia il mercoledì: chiudono la Certosa di San Martino e il Palazzo Reale.

pronto-tre-giorni:
  usa: [tp-capodimonte-orari, tp-catacombe-orari, tp-catacombe-prezzi, tp-madre-orari]
  testo: |
    Sono i due giorni di prima, più una giornata tra Capodimonte, le Catacombe di San Gennaro e il Rione Sanità, con il Madre e Napoli Sotterranea nel pomeriggio. Alle Catacombe entri solo con la guida, e devi prenotare. Il terzo giorno evita il mercoledì, quando chiudono Capodimonte e le Catacombe, e il martedì, quando chiude il Madre.

pronto-regata:
  usa: [tp-palazzoreale-orari]
  testo: |
    La mattina la passi tra piazza del Plebiscito, il Palazzo Reale e il belvedere di Monte Echia, con il golfo davanti. Il pomeriggio sei sul lungomare per le regate, poi fai la passeggiata fino a Mergellina. Il mercoledì il Palazzo Reale è chiuso: scegli un altro giorno.

gite:
  usa: [tp-isole-2027]
  testo: |
    Una gita fuori città (Pompei, Ercolano, il Vesuvio, le isole, Caserta, Sorrento, il museo di Pietrarsa) nel compositore è un giorno a parte, senza altre tappe: quasi tutte occupano la giornata intera. Per le isole, gli orari dei traghetti dell'estate 2027 non sono ancora usciti{?tp-isole-2027}. Quando escono, guarda le ultime corse per tornare.

tempi:
  usa: [trasporti-2027-atteso]
  fonti: [osm, tp-copernicus-dem, tp-anm-gtfs, tp-anm-linea1, tp-comune-linea6, tp-rfi-linea2, tp-trenitalia-linea2, tp-anm-centrale, tp-anm-chiaia, tp-anm-mergellina, tp-comune-montesanto, tp-eav-teleindicatori, tp-anm-ascensori]
  testo: |
    I tempi di spostamento sono stime nostre. Le facciamo sulle strade, le scale e gli ascensori di OpenStreetMap, con le salite prese dal modello del terreno Copernicus: in piano si va a 4,5 km all'ora e ogni 10 metri di salita aggiungono un minuto. Con la metro, le funicolari, la Cumana e gli autobus contiamo anche l'attesa, cioè metà del tempo tra due corse, e il tempo per scendere ai binari o salire sul bus.

    Per gli autobus usiamo gli orari programmati dell'ANM, che li pubblica come dati aperti, per 13 linee: quelle che accorciano gli spostamenti tra le tappe, come il 140 per Posillipo, Marechiaro e la Gaiola, la C21 e la C31 per il Parco Virgiliano, la R7 e la C1 per Città della Scienza, il filobus 204 per Capodimonte. Ti proponiamo il bus solo se fa risparmiare almeno 5 minuti. I minuti sono quelli dell'orario: nel traffico il bus può tardare, anche del 15% o più (è una stima nostra), e lavori o strade chiuse non li conosciamo in anticipo. A Marechiaro e alla Gaiola il bus ti lascia in cima alla discesa: l'ultimo tratto lo fai a piedi.

    I mezzi cambiano con il giorno e l'ora. La Linea 2 passa ogni 8 minuti nei giorni feriali, ogni 15 il sabato e ogni 20 la domenica; il sabato e la domenica la Linea 6 si ferma alle 14:50; la domenica e i festivi gli ascensori gratuiti chiudono alle 14:00. Se non scegli una data, usiamo i tempi di un giorno feriale. La funicolare di Montesanto è chiusa per lavori e la Linea 2 si ferma a Campi Flegrei. Gli orari degli autobus sono quelli dell'autunno 2026, validi fino al 31 dicembre, e li abbiamo letti tra le 9 e le 19: la mattina presto e la sera i bus passano di meno. Li aggiorniamo quando l'ANM pubblica i nuovi.

    Se la data dell'itinerario è dentro l'orario dell'ANM, per i bus usiamo le partenze vere: arrivi alla fermata, guardiamo quando passa il prossimo bus e, se aspettarlo non conviene, ti proponiamo un'altra strada. Il giorno stesso la pagina guarda anche l'ora del telefono: le tappe che segni «Fatto» restano in grigio e quelle che mancano slittano da adesso. Se le permetti di usare la posizione, capisce vicino a quale tappa sei; la posizione resta sul telefono. Per le date fuori dall'orario, come l'estate 2027, il bus resta con l'attesa media.

    Sono gli orari di oggi, perché il piano dei trasporti per il 2027 non è ancora uscito{?trasporti-2027-atteso}.

orari:
  senzaFonte: "Spiega come lavoriamo: orari, prezzi e prenotazioni delle tappe hanno ciascuno la sua scheda con la fonte"
  testo: |
    Orari, prezzi e prenotazioni delle tappe li abbiamo letti sui siti dei gestori il 2 ottobre 2026: valgono oggi, e li ricontrolliamo entro aprile 2027. Le durate delle visite sono stime nostre, tranne dove il gestore dice quanto dura la visita.

salvare:
  senzaFonte: "Spiega come funziona la pagina: niente account, niente server"
  testo: |
    I tuoi itinerari restano solo nella memoria di questo browser: non serve un account e noi non li vediamo. Se mandi il link a qualcuno, l'elenco delle tappe e gli orari stanno dopo il segno «#», una parte dell'indirizzo che il browser non invia al nostro server. Trovi i dettagli nella pagina [privacy](/privacy/).
