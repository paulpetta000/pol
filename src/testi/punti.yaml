# Testi delle schede dei punti da cui guardare (componente Spot): un blocco per punto, con lo stesso id
# di src/data/luoghi.yaml. Ogni blocco deve usare la scheda «perche» del punto e le schede del suo elenco «fatti».
# Sole, gradini e folla restano in luoghi.yaml: sono valutazioni della guida, non informazioni.

villa-comunale:
  usa: [vil-caracciolo, vil-2026-schermi]
  testo: |
    Il lungo tratto tra Mergellina e la Rotonda Diaz: qui nel 2027 ci sarà il Race Village. Sui promontori ci saranno punti di osservazione tipo tribuna e il palco ufficiale per presentazioni e premiazioni.

    Nel 2026 la diretta passava anche sui grandi schermi lungo la strada{?vil-2026-schermi}.

rotonda-diaz:
  usa: [campo-2026, vil-2026-gratis, ped-2026, vil-formato-stampa]
  testo: |
    Sei nel cuore del lungomare, con la spiaggia della Mappatella davanti. Nel 2026 gli AC40 regatavano proprio qui davanti, e qui c'era il palco principale del villaggio, gratuito. Sugli scogli, raccontavano i giornali, il Comune aveva montato quattro pedane panoramiche{?campo-2026,vil-2026-gratis,ped-2026}.

    Nel 2027 il villaggio dovrebbe avere lo stesso formato: maxischermi, cibo e negozio ufficiale{?vil-formato-stampa}.

via-partenope:
  usa: [ped-2027]
  testo: |
    Il lungomare degli alberghi, tra piazza Vittoria e Castel dell'Ovo. Anche qui la Soprintendenza avrebbe permesso pedane e piattaforme sugli scogli, per un anno, fino a luglio 2027: potrebbero tornare per le regate{?ped-2027}. Se conti su questo punto, ricontrolla più avanti: non è detto che le pedane tornino.

castel-dell-ovo:
  usa: [campo-ovo]
  testo: |
    Il castello sorge sull'isolotto di Megaride e segna un'estremità del campo di regata: se vuoi capire dove comincia, parti da qui. Dal ponte e dal Borgo Marinari sei sull'acqua.

via-aniello-falcone:
  usa: [vista-colline-stampa, vista-falcone-tasso]
  testo: |
    Sei sulla lunga balconata del Vomero, sopra Chiaia e Mergellina; poco più in basso c'è la parte alta di via Tasso. Per le regate del 2026 la stampa locale la indicava come un unico lungo belvedere da cui vedere tutto il campo{?vista-colline-stampa,vista-falcone-tasso}. Da lassù, però, vedi il campo intero ma perdi il dettaglio delle manovre.

villa-floridiana:
  usa: [vista-floridiana]
  testo: |
    Villa Floridiana è il parco storico sul fianco del Vomero. Vai fino al belvedere in fondo al parco: da lì vedi il golfo dall'alto. Per le regate del 2026 la stampa locale lo metteva tra i punti panoramici{?vista-floridiana}.

san-martino:
  usa: [vista-anfiteatro]
  testo: |
    Qui sei accanto alla Certosa di San Martino e a Castel Sant'Elmo, e la vista sul golfo è la più ampia. Gli organizzatori descrivono Napoli come un anfiteatro e citano la collina del Vomero, con la Certosa, tra i posti da cui il golfo si vede dall'alto.

monte-echia:
  usa: [vista-echia-2026, vista-anfiteatro, echia-ascensore]
  testo: |
    Sali sulla collina sopra Castel dell'Ovo, che gli organizzatori chiamano Pizzofalcone: è un balcone sul golfo. Per le regate del 2026 la stampa locale e un blog di viaggi napoletano la mettevano tra i punti migliori, con la vista sul mare davanti a Castel dell'Ovo e a via Caracciolo{?vista-echia-2026}.

    Se la salita ti spaventa, c'è un ascensore pubblico. Secondo OpenStreetMap è a pagamento e funziona dal lunedì al sabato dalle 7 alle 22, la domenica e i festivi dalle 7:30 alle 22: controlla sul posto.

via-petrarca:
  usa: [vista-colline-stampa]
  testo: |
    Sei in cima alla collina di Posillipo, su una strada panoramica famosa per la vista sul golfo. Per le regate del 2026 la stampa locale la indicava, insieme a via Orazio, per vedere tutto il campo dall'alto{?vista-colline-stampa}. Il belvedere è anche una tappa degli [itinerari](/napoli/itinerari/).

via-orazio:
  usa: [vista-colline-stampa]
  testo: |
    Sali da Mergellina verso via Petrarca: la strada fa tornanti e in alcuni tratti si affaccia a balcone sul golfo. Anche questa era tra i punti indicati dalla stampa locale per le regate del 2026{?vista-colline-stampa}.

sant-antonio-posillipo:
  usa: [vista-sant-antonio]
  testo: |
    Dal piazzale della chiesa di Sant'Antonio, sopra Mergellina, hai la classica cartolina di Napoli con il Vesuvio di fronte. Per le regate del 2026 la consigliava un blog di viaggi napoletano, non un sito ufficiale{?vista-sant-antonio}; su OpenStreetMap la terrazza è segnata come punto panoramico. È anche una tappa degli [itinerari](/napoli/itinerari/).
