# Testi di /come-vederla/dal-lungomare/. Come si scrivono: vedi src/lib/testi.ts e il README.

punti:
  usa: [campo-mappa-atteso]
  testo: |
    I punti sono divisi in tre zone, con lo stesso numero e colore della mappa. Sul lungomare sei in prima fila. Dalle colline e da Posillipo vedi tutto il campo dall'alto e capisci meglio la regata, ma le barche sono più piccole.

    Sole, gradini e folla sono giudizi nostri, per aiutarti a scegliere. La mappa ufficiale del campo 2027 non è ancora uscita{?campo-mappa-atteso}: intanto prendi le distanze come una stima.

villaggi:
  usa: [vil-caracciolo, vil-caracciolo-gratis, vil-formato-stampa, ped-2027, vil-bagnoli, vil-bagnoli-gratis, vil-bagnoli-accesso, vil-orari-2027]
  testo: |
    ### I villaggi per il pubblico

    Sono due. Il principale, il **Race Village**, sarà lungo viale Francesco Caracciolo: punti di osservazione tipo tribuna ricavati sui promontori e il palco ufficiale per presentazioni e premiazioni. Se l'ingresso sarà libero, gli organizzatori non l'hanno ancora detto{?vil-caracciolo-gratis}.

    Il villaggio dovrebbe avere lo stesso formato del 2026: stand, negozio ufficiale, cibo, maxischermi, palco alla Rotonda Diaz e pedane sugli scogli. La Soprintendenza avrebbe permesso pedane e piattaforme sugli scogli di via Caracciolo, via Partenope e via Nazario Sauro fino a luglio 2027: potrebbero tornare per le regate{?vil-formato-stampa,ped-2027}.

    L'altro villaggio è a **Bagnoli**, accanto alle basi delle squadre: la AC Tech Fan Zone, con maxischermi per le regate, spettacoli, cibo e negozi. Per il Comune di Napoli l'ingresso sarà gratuito. Nei piazzali davanti agli hangar il pubblico non entra. Sul retro delle basi, invece, ci saranno simulatori, negozi delle squadre, bar e ristoranti aperti a tutti.

    Date e orari di apertura dei due villaggi non sono ancora usciti{?vil-orari-2027}: ti conviene ricontrollare più avanti.

campo:
  usa: [vista-vicino, campo-ovo, campo-posillipo, campo-mappa-atteso, vista-anfiteatro, vento-golfo]
  testo: |
    ### Il campo di regata

    Il campo è a pochi metri dalla riva: gli AC75 ti passano davanti a piena velocità. Castel dell'Ovo ne segna un'estremità, e l'altra dovrebbe essere Capo Posillipo{?campo-posillipo}. La mappa ufficiale, con i confini e le zone per il pubblico, non è ancora uscita{?campo-mappa-atteso}.

    Gli organizzatori descrivono Napoli come un anfiteatro: il golfo si vede dal lungomare e dall'alto, da Pizzofalcone, dal Vomero con la Certosa di San Martino e da Posillipo. Nel golfo di solito soffia una brezza di mare costante, con salti di vento e a volte venti termici.

com-era-2026:
  usa: [vil-2026-gratis, vil-2026-orari, vil-2026-show, vil-2026-schermi, vil-2026-radio, ped-2026, vil-2026-folla, vil-2026-sicurezza, campo-2026]
  testo: |
    A settembre 2026 gli AC40 hanno regatato davanti al lungomare Caracciolo, tra Castel dell'Ovo e la Rotonda Diaz{?campo-2026}. È il modello più vicino a quello che vedremo nel 2027.

    Il Race Village era gratuito e stava sul lungomare, chiuso alle auto, con il palco principale alla Rotonda Diaz. Apriva alle 11 e chiudeva alle 21, il sabato alle 20:30 e la domenica alle 22{?vil-2026-gratis,vil-2026-orari}.

    Sul palco, alle 12 e alle 17, c'erano gli show per l'uscita e il rientro delle barche, con le squadre presentate al pubblico. La diretta passava sui grandi schermi del villaggio e lungo via Caracciolo. Per sentire il commento senza ritardo ti bastava la radio ufficiale in cuffia, dal telefono: americascup.livefeed.fm{?vil-2026-show,vil-2026-schermi,vil-2026-radio}.

    Sugli scogli c'erano quattro pedane panoramiche montate dal Comune, raggiungibili con passerelle e pensate anche per persone con disabilità e bambini, come hanno raccontato i giornali{?ped-2026}.

    E la gente? L'ultimo giorno di regate, secondo l'ANSA, sul lungomare ci sono stati oltre 100.000 ingressi. Per la sicurezza, scrivevano i giornali, la Prefettura ha impiegato 1.630 agenti dal 22 al 27 settembre{?vil-2026-folla,vil-2026-sicurezza}.

regole:
  usa: [regole-pubblico-atteso, droni-2026, caldo-bollettini]
  testo: |
    Le regole per il pubblico del 2027 non sono ancora uscite{?regole-pubblico-atteso}: cosa si può portare (borse, bottiglie, animali) e dove saranno bagni e punti acqua. Le diranno gli organizzatori più avanti.

    Il drone lascialo a casa: nel 2026 era vietato farlo volare sopra il campo e sopra le zone del pubblico, anche partendo da terra{?droni-2026}.

    Per il caldo, da fine maggio il Ministero della Salute pubblica ogni giorno un bollettino sulle ondate di calore per 27 città, Napoli compresa, con 4 livelli di rischio. Guardalo la mattina e, nelle ore più calde, cerca l'ombra.
