storia:
  fonti: [ac-host-venue, ac-formato-lvc, etnz-formato, ac-youth-date, ac-risultati, ac-finale-napoli, scuttlebutt-napoli, ac-press-kit, wiki-coppa]
  testo: |
    San Diego, 1995: la Nuova Zelanda vince la Coppa per la prima volta. Nel 2000 la difende ad Auckland battendo Luna Rossa 5–0. Nel 2003 la perde contro gli svizzeri di Alinghi.

    La riconquista alle Bermuda nel 2017, 7–1 contro gli americani, e da allora non l'ha più lasciata. L'ha difesa nel 2021 contro Luna Rossa e nel 2024 a Barcellona contro i britannici, 7–2. Il suo AC75 si chiama Taihoro.

protagonisti:
  fonti: [hof-outteridge, ac-finale-napoli]
  testo: |
    ### Nathan Outteridge

    Australiano, guida i neozelandesi. Con Iain Jensen, oggi il suo trimmer (cioè chi regola le vele), ha vinto l'oro olimpico nel 49er a Londra 2012 e l'argento a Rio 2016.
