# Testi della home. Come si scrivono: vedi src/lib/testi.ts e il README.

prossimo:
  usa: [cal-flotta, cal-match]
  testo: |
    Si apre la Louis Vuitton Cup con due giorni di regate di flotta, tre al giorno, con tutti e sette gli AC75 sulla stessa linea di partenza: non era mai successo nella storia della Coppa. Poi i duelli, le semifinali, la finale e, dal 10 luglio, il Match per la Coppa.

dove:
  usa: [vista-vicino, vista-anfiteatro]
  testo: |
    Il campo di regata è vicino alla riva: gli AC75 passeranno a piena velocità a pochi metri dal lungomare. Dalle colline e da Posillipo invece vedi tutto il golfo dall'alto. Abbiamo scelto undici punti da cui guardare: trova il tuo sulla mappa.

archivio:
  usa: [res-napoli]
  testo: |
    Dal 25 al 27 settembre 2026 il golfo ha ospitato una regata preliminare. Ha vinto Luna Rossa, che nella finale a due ha battuto Emirates Team New Zealand senza mai farsi superare.
