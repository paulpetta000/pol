# Testi di /come-vederla/in-tv-e-streaming/. Come si scrivono: vedi src/lib/testi.ts e il README.

rai:
  usa: [tv-rai, cal-orari]
  testo: |
    ### Gratis, sulla Rai

    In Italia le regate le vedi in chiaro sulla Rai, su più canali e piattaforme: la Rai ha i diritti per la Louis Vuitton Cup, il Match, le regate preliminari, la Youth e la Women's America's Cup. A che ora si parte ogni giorno, però, non si sa ancora: gli orari delle regate 2027 non sono usciti{?cal-orari}.

sky:
  usa: [tv-sky]
  testo: |
    ### A pagamento, su Sky e NOW

    I diritti a pagamento per l'Italia dovrebbero essere di Sky: le regate andrebbero sui suoi canali e in streaming su NOW{?tv-sky}.

youtube:
  usa: [tv-youtube]
  testo: |
    ### Su YouTube

    Su [youtube.com/@americascup](https://www.youtube.com/@americascup), il canale ufficiale dell'America's Cup, trovi regate intere, riassunti e spiegazioni. Alcuni video li trovi anche qui, nella pagina [video da vedere](/capire-la-coppa/video/).

radio:
  usa: [vil-2026-radio]
  testo: |
    ### Alla radio, in cuffia

    Nel 2026 la radio ufficiale dell'America's Cup trasmetteva il commento in diretta, senza ritardo, da ascoltare dal telefono su americascup.livefeed.fm{?vil-2026-radio}. Se guardi dal lungomare, porta le cuffie: vedi le barche e senti cosa succede.
