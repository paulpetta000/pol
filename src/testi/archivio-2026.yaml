# Testi di /archivio-2026/. Come si scrivono: vedi src/lib/testi.ts e il README.

napoli:
  usa: [res-napoli]
  fonti: [ac-risultati, scuttlebutt-napoli]
  testo: |
    Nove AC40, otto regate di flotta e poi la finale a due. Ha vinto Luna Rossa, che in finale ha battuto Emirates Team New Zealand senza mai farsi superare. ARC Team USA, al debutto, ha vinto la prima regata; La Roche-Posay ne ha vinte due, ma si è anche rovesciata due volte.

cagliari:
  usa: [res-cagliari]
  fonti: [ac-risultati, scuttlebutt-cagliari]
  testo: |
    Otto AC40 nel Golfo degli Angeli. Ha vinto Luna Rossa, che in finale ha battuto Emirates Team New Zealand. Le squadre americana e australiana, iscritte in ritardo, non c'erano.

punteggio:
  usa: [res-punteggio]
  testo: |
    Nel 2026 chi vinceva una regata prendeva 10 punti, il secondo 9 e così via, e dopo 8 regate le prime due si giocavano la vittoria in una finale a due{?res-punteggio}. Lo 0 è di chi non ha finito; in arancio le vittorie.

da-sapere:
  usa: [res-non-contano, res-wy, campo-2026, vil-2026-folla]
  testo: |
    I risultati delle regate preliminari del 2026, scrive la stampa specializzata, non contano per la classifica della Louis Vuitton Cup{?res-non-contano}.

    Nel 2026 le squadre potevano schierare una seconda barca con un equipaggio di donne e giovani, chiamata «Women & Youth»: per questo in classifica ci sono più barche che squadre{?res-wy}.

    A Napoli, nel 2026, gli AC40 hanno regatato davanti al lungomare Caracciolo, tra Castel dell'Ovo e la Rotonda Diaz. L'ultimo giorno, secondo l'ANSA, sul lungomare ci sono stati oltre 100.000 ingressi{?campo-2026,vil-2026-folla}.
