# Testi di /come-vederla/. Come si scrivono: vedi src/lib/testi.ts e il README.

lungomare:
  usa: [vista-vicino, vil-caracciolo, vil-caracciolo-gratis, vil-bagnoli, vil-bagnoli-gratis]
  testo: |
    ### Gratis e in prima fila: il lungomare

    Se vuoi vedere le barche da vicino senza spendere niente, vai sul lungomare: il campo di regata è a pochi metri dalla riva, e gli AC75 ti passano davanti a tutta velocità. Lungo via Caracciolo ci sarà il Race Village; se l'ingresso sarà libero, gli organizzatori non l'hanno ancora detto{?vil-caracciolo-gratis}. A Bagnoli, accanto alle basi delle squadre, ci sarà anche la Fan Zone con i maxischermi, gratuita secondo il Comune.

    Nella pagina [dal lungomare](/come-vederla/dal-lungomare/) trovi undici punti da cui guardare, dalla Rotonda Diaz a Posillipo, con sole, gradini e folla.

mare:
  usa: [mare-2027-atteso]
  testo: |
    ### Dal mare, con la tua barca

    È il modo più spettacolare, ma bisogna rispettare regole precise e restare fuori dal campo. Quelle del 2027, cioè l'ordinanza della Capitaneria di porto e la registrazione delle barche, non sono ancora uscite{?mare-2027-atteso}: intanto, nella pagina [dal mare](/come-vederla/dal-mare/), puoi leggere come funzionava nel 2026.

tribune:
  usa: [big-niente]
  testo: |
    ### Seduto in tribuna, o con un pacchetto

    Per ora non si può: biglietti, tribune e pacchetti ufficiali per il 2027 non sono ancora in vendita{?big-niente}. Chi oggi ti vende un posto «ufficiale» non lo è: in [biglietti e ospitalità](/come-vederla/biglietti-e-ospitalita/) trovi cosa si sa e come evitare le truffe.

tv:
  usa: [tv-rai, tv-sky]
  testo: |
    ### Da casa, in TV

    La Rai ha i diritti in chiaro per l'Italia: vedrai gratis la Louis Vuitton Cup, il Match, la Youth e la Women's America's Cup. A pagamento, secondo la stampa, le regate saranno su Sky e in streaming su NOW{?tv-sky}. Tutti i canali sono nella pagina [in TV e in streaming](/come-vederla/in-tv-e-streaming/).
