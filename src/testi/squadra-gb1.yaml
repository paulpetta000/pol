# Testi della pagina /squadre/gb1/. Come si scrivono: vedi src/lib/testi.ts e il README.
# I dati (persone, risultati, equipaggi) sono in src/data/squadre.yaml.

storia:
  fonti: [ac-38, ac-host-venue, ac-youth-date, ac-risultati, ac-finale-napoli, scuttlebutt-napoli, ac-press-kit, wiki-coppa]
  testo: |
    Tutto comincia nel 1851, con una regata intorno all'isola di Wight organizzata dal Royal Yacht Squadron, il club di GB1: da lì nasce la Coppa. Eppure la Gran Bretagna non l'ha mai vinta.

    Nel 2024, con il nome di INEOS Britannia, è arrivata al Match, la finale, per la prima volta dal 1964. Ha perso 7–2 contro i neozelandesi.

da-sapere:
  fonti: [ac-38, ac-host-venue, ac-youth-date, ac-risultati, ac-finale-napoli, scuttlebutt-napoli]
  testo: |
    GB1 è il nome della squadra; la società si chiama Athena Racing. A Napoli, nel 2026, ha schierato anche una seconda barca, per donne e giovani: Cobham-Ultra GB2.

protagonisti:
  fonti: [gb1-fletcher, ac-finale-napoli, allatsea-gb2]
  testo: |
    ### Dylan Fletcher

    Oro olimpico nel 49er a Tokyo 2020, nel 2024 è stato il timoniere della squadra britannica. Dice che la priorità è portare in acqua l'AC75.

    ### Hannah Mills

    Due ori olimpici nel 470, a Rio 2016 e a Tokyo 2020. A Napoli, nel 2026, ha timonato la barca Women & Youth insieme a Ellie Aldridge, oro olimpico di kitefoil a Parigi 2024.
