# Testi di /napoli/mappa/. Come si scrivono: vedi src/lib/testi.ts e il README.

da-sapere:
  usa: [campo-mappa-atteso, vil-caracciolo, vil-bagnoli, sq-basi, linea6-fermate, echia-ascensore]
  testo: |
    La zona tratteggiata del campo di regata è una nostra stima: la mappa ufficiale del 2027, con i confini e le zone per il pubblico, non è ancora uscita{?campo-mappa-atteso}.

    Il Race Village sarà lungo viale Francesco Caracciolo. A Bagnoli ci sono le basi delle squadre, da nord a sud: Emirates Team New Zealand, GB1, Luna Rossa, Tudor Team Alinghi, La Roche-Posay Racing Team, Team Australia e ARC Team USA. Accanto ci sarà la AC Tech Fan Zone, con i maxischermi.

    Per muoverti lungo il mare prendi la Linea 6, la metro più comoda: corre parallela al lungomare, sotto la Riviera di Chiaia, e ferma a Mergellina, Arco Mirelli–Repubblica, San Pasquale, Chiaia–Monte di Dio e Municipio. A Monte Echia si sale anche con un ascensore pubblico, a pagamento secondo OpenStreetMap: controlla gli orari sul posto.
