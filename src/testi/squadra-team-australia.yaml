# Testi della pagina /squadre/team-australia/. Come si scrivono: vedi src/lib/testi.ts e il README.
# I dati (persone, risultati, equipaggi) sono in src/data/squadre.yaml.

storia:
  fonti: [ac-team-australia, ac-host-venue, scuttlebutt-cagliari, ac-bagnoli, ac-press-kit, wiki-coppa]
  testo: |
    Nel 1983 Australia II vinse la Coppa a Newport e interruppe 132 anni di vittorie americane. La nuova sfida australiana è stata accettata a maggio 2026, come sesta iscrizione.

da-sapere:
  fonti: [ac-team-australia, ac-host-venue, scuttlebutt-cagliari, ac-bagnoli]
  testo: |
    Non ha corso le regate preliminari del 2026: la sua prima regata sarà la Louis Vuitton Cup. I sette velisti hanno vinto insieme 24 titoli mondiali e 13 campionati SailGP.

protagonisti:
  fonti: [ac-team-australia]
  testo: |
    ### Tom Slingsby

    Oro olimpico nel Laser a Londra 2012, nove volte campione del mondo e tre volte campione SailGP. Nel 2013 era nell'equipaggio americano che rimontò e vinse la Coppa.
