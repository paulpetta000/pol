# Testi di /calendario/. Come si scrivono: vedi src/lib/testi.ts e il README.

formato:
  usa: [cal-flotta, cal-rr, cal-defender-gironi, cal-ripescaggio, cal-semifinali, cal-finale-lvc, cal-match-preparazione, cal-match, cal-match-riserva, cal-youth, cal-womens]
  testo: |
    Per le prime tre settimane, dal 22 maggio all'11 giugno, in acqua ci sono tutti e sette gli AC75: prima le regate di flotta, con tutte le barche insieme, poi i tre Round Robin, i giri di duelli in cui tutti affrontano tutti. Emirates Team New Zealand, che difende la Coppa, regata con gli altri, ma i suoi risultati non contano per la classifica degli sfidanti.

    Dopo il terzo Round Robin, l'11 giugno, i primi tre sfidanti vanno dritti in semifinale. Gli altri tre si giocano il quarto posto nel ripescaggio del 12 e 13 giugno: in ogni turno passa chi arriva prima a 3 punti. Le semifinali si vincono a 5 vittorie e la finale della Louis Vuitton Cup a 7, su 13 regate al massimo.

    Chi vince la Louis Vuitton Cup sfida i neozelandesi nel Match, dal 10 luglio, dopo almeno cinque giorni di pausa. Anche qui servono 7 vittorie. L'ultimo giorno in programma è il 19 luglio; se il meteo fa saltare delle regate, il direttore di regata può aggiungere giorni.

    In mezzo, sugli AC40, si corrono la Youth America's Cup, per i velisti giovani, dal 2 al 6 giugno, e la Women's America's Cup, per gli equipaggi femminili, dal 5 al 9 luglio. Il formato, spiegato con calma, è in [Capire la Coppa](/capire-la-coppa/).

da-sapere:
  usa: [cal-orari, cal-orari-2026, cal-giorni-match, yw-bando-atteso, cal-vento, cal-preliminari-2027]
  testo: |
    Gli orari del 2027 non sono ancora usciti: non si sa a che ora si parte ogni giorno{?cal-orari}. Per farti un'idea, nel 2026 a Napoli si partiva sempre alle 14, con tre regate al giorno il venerdì e il sabato e due più la finale la domenica{?cal-orari-2026}.

    Non è ancora uscito nemmeno il programma giorno per giorno del Match, con i giorni di regata e quelli di riposo{?cal-giorni-match}. Per la Youth e la Women's America's Cup non abbiamo ancora trovato il bando, cioè il documento con le squadre iscritte e il formato di gara{?yw-bando-atteso}. Se ti iscrivi al calendario, il telefono si aggiorna da solo quando esce qualcosa di nuovo.

    Ogni regata dipende dal vento: gli AC75 partono solo se soffia tra 6,5 e 23 nodi. Se il vento è troppo debole o troppo forte si aspetta, e se non cambia nulla la regata salta.

    Prima del 22 maggio nessun'altra regata preliminare è stata annunciata, per ora{?cal-preliminari-2027}.
