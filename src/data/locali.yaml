# Locali per la pagina «Dove mangiare» e per gli itinerari (blocco C, 04/10/2026; specifica:
# specifiche/itinerari-napoli-ampliamento.md, sezione 2). Ricerca: ricerca/2026-10-04-locali-note/.
#
# Ogni locale è anche una tappa in città degli itinerari: stessi tempi tra le tappe (scripts/itinerari/),
# id diversi da quelli delle tappe. Entrano solo locali con gli orari scritti dal locale (sito o scheda Google).
#
# - lat/lon: l'ingresso, da OpenStreetMap (elemento in «osm»); senza «osm» è il punto della via o della piazza;
# - apertura: giorno per giorno (lun mar mer gio ven sab dom, anche a gruppi: «mar-dom»), con le fasce
#   «12:00-15:30, 19:00-23:30», oppure «chiuso», oppure «?» se il locale non lo scrive. Una fascia che passa
#   la mezzanotte finisce il giorno dopo; «19:30-?» vuol dire ora di chiusura non scritta.
#   Ogni ora deve comparire nel testo della scheda degli orari (la build lo controlla);
# - prezzoBase: il «pasto base» in euro secondo la regola della pagina (src/testi/dove-mangiare.yaml, «fasce»):
#   la fascia (€, €€, €€€) la calcola la build. Senza prezzoBase il locale non ha fascia;
# - cucina: tutte quelle che il menu o la pagina ufficiale dimostrano; piatti: solo quelli nel menu;
# - perche: la scheda con la storia e i riconoscimenti (o perché l'abbiamo scelto noi);
#   rinomatoPer: solo se lo dice una fonte indipendente;
# - menu: la pagina del menu sul sito ufficiale, con la data di controllo; senza, «menu non pubblicato online».
# Orari, prezzi e menu cambiano spesso: si ricontrollano entro il 30/04/2027 (campo «ricontrollare» delle schede).

