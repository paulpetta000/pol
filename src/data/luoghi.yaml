# ---------- Dove guardare ----------
- id: rotonda-diaz
  nome: Rotonda Diaz
  tipo: vista
  zona: Lungomare
  lat: 40.83228
  lon: 14.23033
  testo: "Il cuore del lungomare. Nel 2026 qui c'era il palco principale, con la spiaggia della Mappatella davanti."
  vicino: prima-fila
  visuale: "Passaggi ravvicinati davanti alla scogliera e il palco con le premiazioni."
  sole: "Pieno sole nel pomeriggio, guardando verso il mare: niente ombra sugli scogli."
  gradini: "In piano."
  folla: "La zona più affollata: nel 2026 file lunghe per le pedane."
  servizi: "Nel 2026: maxischermi, cibo e negozio ufficiale nel villaggio."
  arrivare: [san-pasquale, arco-mirelli, fun-chiaia]
  fatti: [vil-2026-gratis, ped-2026, campo-2026]

