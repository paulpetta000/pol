# Punti della mappa. Coordinate da OpenStreetMap (ODbL).
# tipo: vista (dove guardare) | village | stazione | porto | area
# Le schede "vista" hanno anche la valutazione della guida (vicino, visuale, sole, gradini, folla):
# sono consigli nostri, non informazioni ufficiali.

# ---------- Dove guardare ----------
# gruppo: lungomare | colline | posillipo (numeri e colori sulla mappa)
# perche: la scheda di fatti.yaml che spiega perché il punto è in elenco (stato + fonte)
# Un punto nuovo entra solo se lo indicano due fonti indipendenti, oppure una fonte affidabile più i dati di OpenStreetMap.

# Lungomare
- id: villa-comunale
  nome: Via Caracciolo e Villa Comunale
  tipo: vista
  gruppo: lungomare
  zona: Chiaia
  lat: 40.83090
  lon: 14.22560
  testo: "Il lungo tratto tra Mergellina e la Rotonda Diaz, dove nel 2027 sarà il Race Village."
  vicino: prima-fila
  visuale: "Lunga fila di posti sul mare: si segue la barca che passa lungo la costa."
  sole: "Sole nel pomeriggio; un po' d'ombra solo sotto gli alberi della Villa, lontano dal mare."
  gradini: "In piano."
  folla: "Molta gente, ma più spazio che alla Rotonda."
  servizi: "Nel 2026: schermi lungo la strada."
  arrivare: [arco-mirelli, mergellina-l6, san-pasquale]
  perche: vil-caracciolo
  foto: acws-2013-caracciolo
  fatti: [vil-caracciolo, vil-2026-schermi]

- id: rotonda-diaz
  nome: Rotonda Diaz
  tipo: vista
  gruppo: lungomare
  zona: Chiaia
  lat: 40.83228
  lon: 14.23033
  testo: "Il cuore del lungomare. Nel 2026 qui c'era il palco principale, con la spiaggia della Mappatella davanti."
  vicino: prima-fila
  visuale: "Passaggi ravvicinati davanti alla scogliera e il palco con le premiazioni."
  sole: "Pieno sole nel pomeriggio, guardando verso il mare: niente ombra sugli scogli."
  gradini: "In piano."
  folla: "La zona più affollata: nel 2026 file lunghe per le pedane."
  servizi: "Nel 2026: maxischermi, cibo e negozio ufficiale nel villaggio."
  arrivare: [san-pasquale, arco-mirelli, fun-chiaia]
  perche: campo-2026
  foto: acws-2013-partenope
  fatti: [vil-2026-gratis, ped-2026, campo-2026]

- id: via-partenope
  nome: Via Partenope
  tipo: vista
  gruppo: lungomare
  zona: Santa Lucia
  lat: 40.83118
  lon: 14.24399
  testo: "Il lungomare degli alberghi, tra piazza Vittoria e Castel dell'Ovo."
  vicino: vicino
  visuale: "Vista aperta verso Posillipo e l'estremità est del campo."
  sole: "Sole nel pomeriggio."
  gradini: "In piano."
  folla: "Molta gente, soprattutto verso piazza Vittoria."
  servizi: "Bar e ristoranti lungo la strada."
  arrivare: [chiaia-l6, municipio]
  perche: ped-2027
  foto: via-partenope
  fatti: [ped-2027]

- id: castel-dell-ovo
  nome: Castel dell'Ovo e Borgo Marinari
  tipo: vista
  gruppo: lungomare
  zona: Santa Lucia
  lat: 40.82836
  lon: 14.24848
  testo: "Il castello sull'isolotto di Megaride segna un'estremità del campo di regata."
  vicino: prima-fila
  visuale: "Sull'acqua da tre lati: si vede bene la fine del campo."
  sole: "Sole pieno, pochissima ombra."
  gradini: "Si arriva a piedi dal ponte, in piano; dentro il castello ci sono rampe."
  folla: "Spazio limitato sul borgo: si riempie presto."
  servizi: "Ristoranti del Borgo Marinari."
  arrivare: [chiaia-l6, municipio]
  perche: campo-ovo
  foto: acws-2012-ovo
  fatti: [campo-ovo]

# Colline
- id: via-aniello-falcone
  nome: Via Aniello Falcone e via Tasso
  tipo: vista
  gruppo: colline
  zona: Vomero
  lat: 40.83972
  lon: 14.22723
  testo: "La lunga balconata del Vomero sopra Chiaia e Mergellina; poco più in basso c'è la parte alta di via Tasso."
  vicino: dall-alto
  visuale: "Tutto il golfo dall'alto, da Posillipo a Castel dell'Ovo: si capisce la regata, non i dettagli delle manovre."
  sole: "Guardi verso sud: nel pomeriggio il sole è di fronte."
  gradini: "Strada in piano lungo la collina; per arrivarci salite, scale o funicolare."
  folla: "Meno gente che sul lungomare (nostra stima)."
  servizi: "Bar e locali lungo la strada; nessun servizio ufficiale."
  arrivare: [fun-cimarosa]
  perche: vista-colline-stampa
  fatti: [vista-falcone-tasso]

- id: villa-floridiana
  nome: Belvedere della Villa Floridiana
  tipo: vista
  gruppo: colline
  zona: Vomero
  lat: 40.83987
  lon: 14.23406
  testo: "Il parco storico del Vomero: dal belvedere in fondo al parco si vede il golfo dall'alto."
  vicino: dall-alto
  visuale: "Il mare davanti a Chiaia dall'alto, in un angolo più tranquillo di via Falcone."
  sole: "Alberi e ombra nel parco; sul belvedere sole nel pomeriggio."
  gradini: "Viali in pendenza e scale dentro il parco."
  folla: "Poca gente (nostra stima)."
  servizi: "È un parco con orari di apertura: controllali prima di andare."
  arrivare: [fun-cimarosa]
  perche: vista-floridiana
  foto: floridiana-viale

- id: san-martino
  nome: Belvedere di San Martino
  tipo: vista
  gruppo: colline
  zona: Vomero
  lat: 40.84411
  lon: 14.24086
  testo: "Accanto alla Certosa di San Martino e a Castel Sant'Elmo: la vista più ampia sul golfo."
  vicino: dall-alto
  visuale: "Tutto il golfo, ma le barche si vedono piccole: porta un binocolo."
  sole: "Esposto, poca ombra."
  gradini: "Si sale in funicolare e poi a piedi, con salite e scale."
  folla: "Meno gente che sul lungomare (nostra stima)."
  servizi: "Nessun servizio ufficiale."
  arrivare: [fun-chiaia, fun-centrale]
  perche: vista-anfiteatro
  foto: vista-san-martino

- id: monte-echia
  nome: Monte Echia (Pizzofalcone)
  tipo: vista
  gruppo: colline
  zona: Pizzofalcone
  lat: 40.83123
  lon: 14.24792
  testo: "La collina sopra Castel dell'Ovo: un balcone sul golfo e sul campo di regata."
  vicino: dall-alto
  visuale: "Tutto il campo dall'alto, con il Vesuvio alle spalle."
  sole: "Sole pieno nel pomeriggio."
  gradini: "Salita ripida a piedi; c'è anche un ascensore pubblico."
  folla: "Meno gente che sul lungomare (nostra stima)."
  servizi: "Nessun servizio ufficiale."
  arrivare: [chiaia-l6, municipio]
  perche: vista-echia-2026
  fatti: [vista-anfiteatro, echia-ascensore]

# Posillipo
- id: via-petrarca
  nome: Via Petrarca
  tipo: vista
  gruppo: posillipo
  zona: Posillipo
  lat: 40.82215
  lon: 14.21284
  testo: "La strada panoramica in cima alla collina di Posillipo, famosa per la vista sul golfo."
  vicino: dall-alto
  visuale: "Il golfo intero, con il campo di regata lontano e più in basso: porta un binocolo."
  sole: "Guardi verso sud-est: nel tardo pomeriggio il sole è alle spalle."
  gradini: "Strada trafficata: guarda dagli slarghi panoramici, non dal bordo della carreggiata."
  folla: "Poca gente (nostra stima)."
  servizi: "Nessun servizio ufficiale."
  arrivare: [fun-manzoni]
  perche: vista-colline-stampa

- id: via-orazio
  nome: Via Orazio
  tipo: vista
  gruppo: posillipo
  zona: Posillipo
  lat: 40.82569
  lon: 14.21734
  testo: "La strada a tornanti che sale da Mergellina verso via Petrarca, con tratti a balcone sul golfo."
  vicino: dall-alto
  visuale: "Il campo di regata dall'alto e tutto il golfo: si vede l'insieme, non i dettagli."
  sole: "Guardi verso sud-est: nel pomeriggio il sole è alle spalle o di lato."
  gradini: "Strada in salita e trafficata: resta sul marciapiede."
  folla: "Meno gente che sul lungomare (nostra stima)."
  servizi: "Qualche bar lungo la strada; nessun servizio ufficiale."
  arrivare: [fun-sant-antonio, mergellina-l6]
  perche: vista-colline-stampa

- id: sant-antonio-posillipo
  nome: Terrazza di Sant'Antonio a Posillipo
  tipo: vista
  gruppo: posillipo
  zona: Posillipo
  lat: 40.82807
  lon: 14.21781
  testo: "Il piazzale della chiesa di Sant'Antonio, sopra Mergellina: la classica cartolina di Napoli con il Vesuvio."
  vicino: dall-alto
  visuale: "Il golfo con il Vesuvio di fronte e il campo di regata più in basso."
  sole: "Guardi verso est: il sole del pomeriggio è alle spalle."
  gradini: "Da Mergellina si sale a piedi con rampe e scale, oppure con la funicolare di Mergellina."
  folla: "Terrazza piccola: si riempie presto (nostra stima)."
  servizi: "Nessun servizio ufficiale."
  arrivare: [fun-sant-antonio, mergellina-l6, mergellina-l2]
  perche: vista-sant-antonio

