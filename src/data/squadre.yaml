    - nome: Peter Burling
      paese: Nuova Zelanda
      testo: "Ha vinto la Coppa da timoniere con Team New Zealand nel 2017, 2021 e 2024. Oro olimpico nel 49er a Rio 2016. Ora guida Luna Rossa."
