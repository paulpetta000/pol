    - "A Napoli 2026 non è mai stata superata in nessuna boa nelle ultime tre regate, finale compresa."
    - "Marco Gradoni e Maria Giubilei vengono dal percorso giovani e donne: sono la generazione della Youth e della Women's America's Cup."
