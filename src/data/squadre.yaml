        - { nome: Marco Gradoni, ruolo: timoniere }
        - { nome: Gianluigi Ugolini, ruolo: trimmer }
        - { nome: Maria Giubilei, ruolo: trimmer }
    - barca: "Luna Rossa Women & Youth"
