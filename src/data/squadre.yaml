- id: emirates-team-new-zealand
  nome: Emirates Team New Zealand
  breve: ETNZ
  paese: Nuova Zelanda
  bandiera: nz
  ruolo: defender
  club: Royal New Zealand Yacht Squadron
  colore: "#101418"
  sito: https://emirates-team-new-zealand.americascup.com/
  ordine: 1
  sintesi: "Difende la Coppa. Ha vinto le ultime tre edizioni (2017, 2021, 2024) e a Napoli punta alla quarta di fila."
  storia:
    - "La prima vittoria arriva nel 1995 a San Diego: la Coppa va in Nuova Zelanda."
    - "Nel 2000 la difende ad Auckland battendo Luna Rossa 5–0. Nel 2003 la perde contro gli svizzeri di Alinghi."
    - "La riconquista alle Bermuda nel 2017 (7–1 contro gli americani), la difende nel 2021 contro Luna Rossa e nel 2024 a Barcellona contro i britannici (7–2)."
  daSapere:
    - "Da Defender non deve qualificarsi: aspetta al Match il vincitore della Louis Vuitton Cup."
    - "Corre comunque regate di flotta e Round Robin della Louis Vuitton Cup, ma i suoi risultati non contano per gli sfidanti."
    - "Il suo AC75 si chiama Taihoro."
  persone:
    - { nome: Grant Dalton, ruolo: "Amministratore delegato; presiede anche l'America's Cup Partnership" }
    - { nome: Nathan Outteridge, ruolo: "Skipper e timoniere" }
  risultati2026:
    - { evento: cagliari, barca: "Emirates Team New Zealand", pos: 2, punti: 60, nota: "Perde la finale contro Luna Rossa" }
    - { evento: cagliari, barca: "Emirates Team New Zealand Women & Youth", pos: 5, punti: 50 }
    - { evento: napoli, barca: "Emirates Team New Zealand", pos: 2, punti: 56, nota: "Perde la finale contro Luna Rossa" }
    - { evento: napoli, barca: "Emirates Team New Zealand Women & Youth", pos: 5, punti: 44, nota: "Prima tra le barche Women & Youth" }
  equipaggi:
    - barca: "Emirates Team New Zealand"
      velisti:
        - { nome: Nathan Outteridge, ruolo: timoniere }
        - { nome: Seb Menzies, ruolo: timoniere }
        - { nome: Andy Maloney, ruolo: trimmer }
        - { nome: Iain Jensen, ruolo: trimmer }
    - barca: "Emirates Team New Zealand Women & Youth"
      velisti:
        - { nome: Jake Pye, ruolo: timoniere }
        - { nome: Erica Dawson, ruolo: timoniera }
        - { nome: Serena Woodall, ruolo: trimmer }
        - { nome: Josh Armit, ruolo: trimmer }
  protagonisti:
    - nome: Nathan Outteridge
      paese: Australia
      testo: "Australiano, guida i neozelandesi. Con Iain Jensen, oggi suo trimmer, ha vinto l'oro olimpico nel 49er a Londra 2012 e l'argento a Rio 2016."
