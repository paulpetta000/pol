# Tappe degli itinerari (Rilascio 3): 33 in città, da combinare tra loro, e 6 gite che occupano una giornata intera.
#
# Ogni tappa:
# - posizione: lat/lon dell'ingresso (da OpenStreetMap, elemento in «osm»). I percorsi a piedi hanno anche
#   «fine», il punto dove finiscono; «reversibile: false» se conviene farli solo in quel verso;
# - durata: minuti per la visita (stima nostra, oppure «durataFonte» se la dice il gestore);
# - orari e prezzi: schede in fatti.yaml (id che cominciano con «tp-»), con la data entro cui ricontrollarle.
#   Gli orari sono quelli in vigore il 2 ottobre 2026: per l'estate 2027 nessun ente li ha ancora pubblicati;
# - chiuso: giorni di chiusura settimanale (lun mar mer gio ven sab dom), presi dalla scheda degli orari;
# - alChiuso, gradini, bambini, momento: valutazioni nostre, spiegate nel testo della tappa
#   (src/testi/tappe.yaml, stesso id); gradini manca se non lo sappiamo;
# - avviso: «chiuso-in-parte» se una parte importante oggi è chiusa.
# I tempi tra le tappe sono in src/data/tempi-tappe.json (scripts/itinerari/).

