- id: atteso-coppa-2027
  cosa: "Ordinanza della Capitaneria, piano trasporti, mappa ufficiale del campo di regata, regole di regata 2027, biglietti e tribune, orari del Race Village"
  schede: [campo-mappa-atteso, regole-pubblico-atteso, mare-2027-atteso, trasporti-2027-atteso, acc-2027-atteso, big-niente, big-tribune, big-ospitalita, vil-orari-2027, cal-orari, cal-giorni-match, cal-preliminari-2027, yw-bando-atteso, reg-2027-attese]
  da-dove: "americascup.com, Comune di Napoli, Capitaneria di Porto: vedi le fonti nelle singole schede"
  ricontrollare: "prima scadenza 15/11/2026 (biglietti e ospitalità), poi 31/12/2026, 31/01 e 28/02/2027"

